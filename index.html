<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 경험 정리</title>
<style>
:root{font-family:Arial,"Noto Sans KR",sans-serif;color:#202334;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e8e9ef;padding:17px max(5%,calc((100% - 1060px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header h2{font-size:19px;margin:0;cursor:pointer}nav{display:flex;gap:8px}main{max-width:1060px;margin:34px auto;padding:0 20px}h1{font-size:27px;margin:0 0 8px}h3{margin:0 0 18px}.muted{color:#85899a;font-size:13px}button{border:0;border-radius:9px;padding:11px 15px;font-size:14px;cursor:pointer}.primary{background:#5368df;color:white}.secondary{background:#eceef5;color:#303447}.danger{background:#fff0f0;color:#c63b47}.card{background:white;border-radius:15px;padding:22px;margin:18px 0;box-shadow:0 3px 14px #20233408}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat-number{font-size:29px;font-weight:750;margin-top:10px}label{font-weight:650;font-size:14px}input,textarea,select{width:100%;padding:13px;border:1px solid #dfe1e9;border-radius:9px;margin:7px 0 17px;font:inherit;font-size:14px;background:white}textarea{min-height:105px;resize:vertical}.experience{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:17px 0;border-bottom:1px solid #eef0f4;cursor:pointer}.experience:last-child{border:0}.experience strong{display:block;margin-bottom:7px}.tag{display:inline-block;padding:5px 9px;background:#eef0ff;color:#5266d5;border-radius:30px;font-size:12px}.status{font-size:12px;color:#777;margin-top:6px;text-align:right}.bar-row{display:flex;align-items:center;gap:12px;margin:13px 0}.bar-label{width:85px;font-size:13px}.bar-bg{height:10px;background:#eff0f4;border-radius:20px;overflow:hidden;flex:1}.bar{height:100%;background:#7184ed}.bar-count{width:22px;text-align:right;font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.hidden{display:none}.detail-block{margin:22px 0}.detail-block h4{margin:0 0 7px}.detail-block p{line-height:1.75;white-space:pre-wrap;color:#555;margin:0}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}header{padding:15px 5%}main{margin-top:25px}.card{padding:17px}}
</style></head><body>
<header><h2 onclick="showDashboard()">My Experiences</h2><nav><button class="secondary" onclick="showDashboard()">대시보드</button><button class="primary" onclick="showForm()">+ 경험 추가</button></nav></header>
<main>
<section id="dashboard"><h1>나의 경험 대시보드</h1><p class="muted">지금까지 쌓아온 경험을 한눈에 확인해 보세요. 기록은 현재 브라우저에 저장됩니다.</p>
<div class="stats"><div class="card"><div class="muted">전체 경험</div><div class="stat-number" id="total">0</div></div><div class="card"><div class="muted">완료</div><div class="stat-number" id="completed">0</div></div><div class="card"><div class="muted">미완성</div><div class="stat-number" id="incomplete">0</div></div><div class="card"><div class="muted">완료율</div><div class="stat-number" id="rate">0%</div></div></div>
<div class="card"><h3>종류별 경험</h3><div id="kindChart"></div></div><div class="card"><h3>내 경험 목록</h3><div id="experienceList"></div></div><button class="primary" onclick="showForm()">+ 새로운 경험 작성하기</button></section>
<section id="formPage" class="hidden"><h1 id="formTitle">새 경험 작성</h1><p class="muted">경험에 대한 내용을 입력해 주세요.</p><div class="card"><form id="experienceForm">
<label>날짜 *</label><input type="date" id="date" required><label>경험 이름 *</label><input type="text" id="name" placeholder="예: 디즈니 인턴십" required>
<label>경험 종류 *</label><select id="kind" required><option value="">선택해 주세요</option><option>동아리</option><option>프로젝트</option><option>대외활동</option><option>인턴</option><option>기타</option></select>
<label>역할 *</label><input type="text" id="role" placeholder="예: 팀원, 기획, 운영" required><h3>STAR 정리</h3>
<label>Situation - 상황 (S)</label><textarea id="s" placeholder="어떤 상황이었나요?"></textarea><label>Task - 과제 (T)</label><textarea id="t" placeholder="해결해야 했던 과제는 무엇인가요?"></textarea><label>Action - 행동 (A)</label><textarea id="a" placeholder="어떤 행동을 했나요?"></textarea><label>Result - 결과 (R)</label><textarea id="r" placeholder="어떤 결과가 있었나요?"></textarea>
<div id="otherArea" class="hidden"><label>기타 설명 *</label><textarea id="otherDescription"></textarea></div><div class="actions"><button class="primary" type="submit" id="saveButton">저장하기</button><button class="secondary" type="button" onclick="showDashboard()">취소</button></div></form></div></section>
<section id="detailPage" class="hidden"><h1>경험 상세</h1><div class="card"><h2 id="detailName"></h2><p class="muted" id="detailMeta"></p><span class="tag" id="detailKind"></span> <span class="status" id="detailStatus"></span>
<div class="detail-block"><h4>역할</h4><p id="detailRole"></p></div><div class="detail-block"><h4>Situation (상황)</h4><p id="detailS"></p></div><div class="detail-block"><h4>Task (과제)</h4><p id="detailT"></p></div><div class="detail-block"><h4>Action (행동)</h4><p id="detailA"></p></div><div class="detail-block"><h4>Result (결과)</h4><p id="detailR"></p></div><div class="detail-block" id="detailOtherArea"><h4>기타 설명</h4><p id="detailOther"></p></div>
<div class="actions"><button class="primary" onclick="editCurrent()">수정하기</button><button class="danger" onclick="deleteCurrent()">삭제하기</button><button class="secondary" onclick="showDashboard()">목록으로</button></div></div></section>
</main><script>
let experiences=[],currentId=null,editingId=null;
const STORAGE_KEY='my-experiences-v1';
function readExperiences(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return []}}
function writeExperiences(items){localStorage.setItem(STORAGE_KEY,JSON.stringify(items))}
async function api(action,data={}){
  let items=readExperiences();
  if(action==='dashboard'){
    const total=items.length,completed=items.filter(x=>x.status==='완료').length;
    return {total,completed,incomplete:total-completed,completionRate:total?Math.round(completed/total*100):0,categories:['동아리','프로젝트','대외활동','인턴','기타'].map(name=>({name,count:items.filter(x=>x.kind===name).length})),experiences:items};
  }
  if(action==='save'){
    const f=data.data||{};
    if(!f.date||!f.name||!f.kind||!f.role)throw new Error('날짜, 경험 이름, 종류, 역할을 입력해 주세요.');
    if(f.kind==='기타'&&!f.otherDescription)throw new Error('기타 경험에 대한 설명을 입력해 주세요.');
    const id=f.id||((crypto.randomUUID&&crypto.randomUUID())||('exp-'+Date.now()+'-'+Math.random().toString(36).slice(2)));
    const complete=[f.s,f.t,f.a,f.r].every(v=>String(v||'').trim()!=='');
    const item={...f,id,status:complete?'완료':'미완성',preview:f.r?f.r.substring(0,100):'결과 내용 없음'};
    const index=items.findIndex(x=>x.id===id);
    if(index>=0)items[index]=item;else items.unshift(item);
    writeExperiences(items);return {id,status:item.status};
  }
  if(action==='delete'){
    const next=items.filter(x=>x.id!==data.id);
    if(next.length===items.length)throw new Error('삭제할 경험을 찾을 수 없습니다.');
    writeExperiences(next);return {ok:true};
  }
  throw new Error('지원하지 않는 요청입니다.');
}
function showPage(id){['dashboard','formPage','detailPage'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');window.scrollTo(0,0);}
async function showDashboard(){showPage('dashboard');try{const d=await api('dashboard');experiences=d.experiences||[];total.textContent=d.total;completed.textContent=d.completed;incomplete.textContent=d.incomplete;rate.textContent=d.completionRate+'%';renderChart(d.categories||[]);renderList();}catch(e){alert('경험 목록을 불러오지 못했습니다.\n'+e.message);}}
function renderChart(c){const m=Math.max(1,...c.map(x=>x.count));kindChart.innerHTML=c.map(x=>'<div class="bar-row"><div class="bar-label">'+esc(x.name)+'</div><div class="bar-bg"><div class="bar" style="width:'+(x.count/m*100)+'%"></div></div><div class="bar-count">'+x.count+'</div></div>').join('');}
function renderList(){if(!experiences.length){experienceList.innerHTML='<p class="muted">아직 저장된 경험이 없습니다.</p>';return;}experienceList.innerHTML=experiences.map(x=>'<div class="experience" data-id="'+esc(x.id)+'"><div><strong>'+esc(x.name)+'</strong><span class="muted">'+esc(x.date)+' · '+esc(x.kind)+'</span></div><div style="text-align:right"><span class="tag">'+esc(x.kind)+'</span><div class="status">'+esc(x.status)+'</div></div></div>').join('');experienceList.querySelectorAll('.experience').forEach(el=>el.addEventListener('click',()=>showDetail(el.dataset.id)));}
function showDetail(id){const x=experiences.find(v=>v.id===id);if(!x)return alert('경험을 찾을 수 없습니다.');currentId=id;const m={detailName:x.name,detailMeta:x.date+' · '+(x.role||'역할 미입력'),detailKind:x.kind,detailStatus:x.status,detailRole:x.role||'입력된 내용이 없습니다.',detailS:x.s||'입력된 내용이 없습니다.',detailT:x.t||'입력된 내용이 없습니다.',detailA:x.a||'입력된 내용이 없습니다.',detailR:x.r||'입력된 내용이 없습니다.',detailOther:x.otherDescription||'입력된 내용이 없습니다.'};Object.keys(m).forEach(k=>document.getElementById(k).textContent=m[k]);detailOtherArea.style.display=x.otherDescription?'block':'none';showPage('detailPage');}
function showForm(){editingId=null;experienceForm.reset();formTitle.textContent='새 경험 작성';saveButton.textContent='저장하기';otherArea.classList.add('hidden');showPage('formPage');}
function editCurrent(){const x=experiences.find(v=>v.id===currentId);if(!x)return alert('수정할 경험을 찾을 수 없습니다.');editingId=x.id;['date','name','kind','role','s','t','a','r','otherDescription'].forEach(k=>document.getElementById(k).value=x[k]||'');otherArea.classList.toggle('hidden',x.kind!=='기타');formTitle.textContent='경험 수정';saveButton.textContent='수정 내용 저장';showPage('formPage');}
async function deleteCurrent(){if(!currentId||!confirm('정말 이 경험을 삭제하시겠습니까? 삭제한 내용은 복구할 수 없습니다.'))return;try{await api('delete',{id:currentId});currentId=null;alert('경험이 삭제되었습니다.');await showDashboard();}catch(e){alert('삭제에 실패했습니다.\n'+e.message);}}
kind.addEventListener('change',()=>otherArea.classList.toggle('hidden',kind.value!=='기타'));
experienceForm.addEventListener('submit',async e=>{e.preventDefault();const data={id:editingId,date:date.value,name:name.value.trim(),kind:kind.value,role:role.value.trim(),s:s.value.trim(),t:t.value.trim(),a:a.value.trim(),r:r.value.trim(),otherDescription:otherDescription.value.trim()};saveButton.disabled=true;saveButton.textContent='저장 중...';try{await api('save',{data});editingId=null;alert('경험이 저장되었습니다.');await showDashboard();}catch(err){alert('저장에 실패했습니다.\n'+err.message);}finally{saveButton.disabled=false;saveButton.textContent=editingId?'수정 내용 저장':'저장하기';}});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
showDashboard();
</script></body></html>
